<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Dashboard - Smart Health</title>

<!-- Chart.js for live charts -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { font-family: Arial; background: #f0f4f8; margin: 0; padding: 0; }
header { background: #2196F3; color: #fff; padding: 20px; text-align:center; }
.container { padding: 20px; max-width: 900px; margin:auto; }
.card { background: #fff; border-radius: 8px; padding:20px; margin-bottom:20px; box-shadow:0 4px 6px rgba(0,0,0,0.1);}
h2 { margin-top:0; }
span.value { font-size: 2em; font-weight: bold; }
.alert { color: red; font-weight: bold; }
button { padding: 10px 20px; background:#ff4b5c; color:#fff; border:none; cursor:pointer; border-radius:5px; margin-top:10px;}
</style>
</head>
<body>

<header>
<h1>Patient Dashboard</h1>
<p>Real-time Heart Rate & SpO₂ Monitoring</p>
<button onclick="logout()">Logout</button>
</header>

<div class="container">

<div class="card">
<h2>Heart Rate</h2>
<p>Current: <span id="hrValue">--</span> bpm</p>
<canvas id="hrChart" height="100"></canvas>
</div>

<div class="card">
<h2>SpO₂</h2>
<p>Current: <span id="spo2Value">--</span> %</p>
<canvas id="spo2Chart" height="100"></canvas>
</div>

<audio id="alertSound">
  <source src="https://www.soundjay.com/button/beep-07.wav" type="audio/wav">
</audio>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
// 🔹 Firebase config
var firebaseConfig = {
  apiKey: "AIzaSyCq4-w3QU9AWdu97W3moKyih6ANCN0mFxE",
  authDomain: "health-monitor-58970.firebaseapp.com",
  databaseURL: "https://health-monitor-58970-default-rtdb.firebaseio.com",
  projectId: "health-monitor-58970",
  storageBucket: "health-monitor-58970.firebasestorage.app",
  messagingSenderId: "389520868404",
  appId: "1:389520868404:web:e2e915837835454825f661",
  measurementId: "G-P2ZDW69QXQ"
};
firebase.initializeApp(firebaseConfig);

// 🔹 Logout function
function logout() {
  firebase.auth().signOut();
  window.location = "login.html";
}

// 🔹 Redirect if not logged in
firebase.auth().onAuthStateChanged(user => {
  if(!user) window.location = "login.html";
});

// 🔹 References
const hrValue = document.getElementById("hrValue");
const spo2Value = document.getElementById("spo2Value");
const alertSound = document.getElementById("alertSound");

// 🔹 Charts setup
let hrChartCtx = document.getElementById("hrChart").getContext("2d");
let spo2ChartCtx = document.getElementById("spo2Chart").getContext("2d");

let hrChart = new Chart(hrChartCtx, {
  type: 'line',
  data: { labels: [], datasets: [{ label:'Heart Rate (bpm)', data: [], borderColor:'#FF5733', fill:false }] },
  options: { animation:false, scales:{ x:{display:false}, y:{min:40,max:180} } }
});

let spo2Chart = new Chart(spo2ChartCtx, {
  type: 'line',
  data: { labels: [], datasets: [{ label:'SpO₂ (%)', data: [], borderColor:'#33C3FF', fill:false }] },
  options: { animation:false, scales:{ x:{display:false}, y:{min:80,max:100} } }
});

// 🔹 Firebase database listener
firebase.database().ref("/patient").on("value", snapshot => {
  const data = snapshot.val();
  if(!data) return;

  const hr = data.heartRate || 0;
  const spo2 = data.spo2 || 0;

  hrValue.innerText = hr;
  spo2Value.innerText = spo2;

  // Add to charts
  const time = new Date().toLocaleTimeString();
  if(hrChart.data.labels.length > 20) {
    hrChart.data.labels.shift(); hrChart.data.datasets[0].data.shift();
    spo2Chart.data.labels.shift(); spo2Chart.data.datasets[0].data.shift();
  }
  hrChart.data.labels.push(time); hrChart.data.datasets[0].data.push(hr);
  spo2Chart.data.labels.push(time); spo2Chart.data.datasets[0].data.push(spo2);
  hrChart.update(); spo2Chart.update();

  // Alert if heart rate <50 or >120, or SpO₂ < 90
  if(hr < 50 || hr > 120 || spo2 < 90) alertSound.play();
});
</script>

</body>
</html>
