<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Patient Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@2.6.4/dist/email.min.js"></script>
<style>
body {font-family: Arial; background:#f2f2f2; padding:20px;}
h2 {color:#3f87a6;}
canvas {background:#fff; padding:20px; border-radius:10px; margin-bottom:20px;}
#alert {color:red; font-weight:bold;}
</style>
</head>
<body>

<h2>Patient Dashboard</h2>
<p id="welcome"></p>
<p id="alert"></p>
<canvas id="hrChart" width="400" height="200"></canvas>
<canvas id="spo2Chart" width="400" height="200"></canvas>
<audio id="alertSound" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"></audio>

<script>
// Firebase config
var firebaseConfig = {
    apiKey: "AIzaSyCq4-w3QU9AWdu97W3moKyih6ANCN0mFxE",
  authDomain: "health-monitor-58970.firebaseapp.com",
  databaseURL: "https://health-monitor-58970-default-rtdb.firebaseio.com",
  projectId: "health-monitor-58970",
  storageBucket: "health-monitor-58970.firebasestorage.app",
  messagingSenderId: "389520868404",
  appId: "1:389520868404:web:e2e915837835454825f661",
  measurementId: "G-P2ZDW69QXQ"
};
firebase.initializeApp(firebaseConfig);
var database = firebase.database();

// EmailJS init
emailjs.init("JESUNAAMALI");

var patientKey = localStorage.getItem("currentPatient");
database.ref("patients/"+patientKey).once("value", function(snapshot){
    var patient = snapshot.val();
    document.getElementById("welcome").innerText = "Welcome, "+patient.name;
});

// Chart.js setup
var hrCtx = document.getElementById('hrChart').getContext('2d');
var hrChart = new Chart(hrCtx, {type:'line', data:{labels:[], datasets:[{label:'Heart Rate', data:[], borderColor:'red', fill:false}]}});
var spo2Ctx = document.getElementById('spo2Chart').getContext('2d');
var spo2Chart = new Chart(spo2Ctx, {type:'line', data:{labels:[], datasets:[{label:'SpO2', data:[], borderColor:'blue', fill:false}]} });

var hrData = [], spo2Data = [];

// Live data simulation (replace with sensor values)
setInterval(function(){
    var now = new Date().toLocaleTimeString();
    var hr = Math.floor(Math.random()*40)+60;  // 60-100 bpm
    var spo2 = Math.floor(Math.random()*5)+95; // 95-100%

    // Keep last 10 points
    if(hrChart.data.labels.length>10){ hrChart.data.labels.shift(); hrChart.data.datasets[0].data.shift(); }
    if(spo2Chart.data.labels.length>10){ spo2Chart.data.labels.shift(); spo2Chart.data.datasets[0].data.shift(); }

    // Add new data
    hrChart.data.labels.push(now); hrChart.data.datasets[0].data.push(hr); hrChart.update();
    spo2Chart.data.labels.push(now); spo2Chart.data.datasets[0].data.push(spo2); spo2Chart.update();

    // Store for AI prediction
    hrData.push(hr); if(hrData.length>10) hrData.shift();
    spo2Data.push(spo2); if(spo2Data.length>10) spo2Data.shift();

    // Check alerts
    if(hr<60 || hr>100 || spo2<95){
        document.getElementById("alert").innerText = "⚠️ Critical Health Alert!";
        document.getElementById("alertSound").play();
        sendEmailAlert(hr, spo2);
    } else {
        document.getElementById("alert").innerText = "";
    }

    // Simple AI prediction
    var hrPred = hrData.reduce((a,b)=>a+b,0)/hrData.length;
    var spo2Pred = spo2Data.reduce((a,b)=>a+b,0)/spo2Data.length;
    console.log("Predicted HR:", Math.round(hrPred), "Predicted SpO2:", Math.round(spo2Pred));

}, 2000);

// Send Email Alert using EmailJS
function sendEmailAlert(hr, spo2){
    var templateParams = {
        patient_name: document.getElementById("welcome").innerText,
        hr_value: hr,
        spo2_value: spo2,
        to_email: "doctor@example.com"
    };
    emailjs.send('service_tqt0lcn', 'template_898oe0j', templateParams)
    .then(function(response) {
       console.log('Email sent!', response.status, response.text);
    }, function(error) {
       console.log('Email error', error);
    });
}

</script>

</body>
</html>
