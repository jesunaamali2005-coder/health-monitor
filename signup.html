<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup - Smart Health</title>
<style>
body { font-family: Arial; display:flex; justify-content:center; align-items:center; height:100vh; background:#4CAF50; }
.container { background:#fff; padding:30px; border-radius:8px; width:300px; text-align:center; }
input { width:90%; padding:10px; margin:10px 0; }
button { padding:10px 20px; background:#ff4b5c; color:#fff; border:none; cursor:pointer; }
</style>
</head>
<body>
<div class="container">
<h2>Create Account</h2>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button id="signupBtn">Signup</button>
<p id="message"></p>
</div>

<script>
const signupBtn = document.getElementById('signupBtn');

signupBtn.addEventListener('click', () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    firebase.auth().createUserWithEmailAndPassword(email, password)
    .then((userCredential) => {
        const uid = userCredential.user.uid;
        // Save user in database
        firebase.database().ref('users/' + uid).set({
            email: email,
            role: "patient" // default role
        });
        document.getElementById('message').innerText = "Signup successful! Redirecting...";
        setTimeout(() => { window.location = "login.html"; }, 1500);
    })
    .catch((error) => {
        document.getElementById('message').innerText = error.message;
    });
});
</script>
</body>
</html>
