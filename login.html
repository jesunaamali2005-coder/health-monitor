<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Health Monitoring</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
body {font-family: Arial; background:#3f87a6; display:flex; justify-content:center; align-items:center; height:100vh;}
#loginBox {background:#fff; padding:40px; border-radius:10px; text-align:center;}
input {margin:10px 0; padding:10px; width:100%;}
button {padding:10px 20px; background:#ff4c4c; color:#fff; border:none; cursor:pointer;}
</style>
</head>
<body>

<div id="loginBox">
<h2>Smart Health Monitoring</h2>
<input type="email" id="email" placeholder="Email"><br>
<input type="password" id="password" placeholder="Password"><br>
<button onclick="loginPatient()">Login</button>
<p id="error" style="color:red"></p>
</div>

<script>
// Firebase config
var firebaseConfig = {
    apiKey: "AIzaSyCq4-w3QU9AWdu97W3moKyih6ANCN0mFxE",
  authDomain: "health-monitor-58970.firebaseapp.com",
  databaseURL: "https://health-monitor-58970-default-rtdb.firebaseio.com",
  projectId: "health-monitor-58970",
  storageBucket: "health-monitor-58970.firebasestorage.app",
  messagingSenderId: "389520868404",
  appId: "1:389520868404:web:e2e915837835454825f661",
  measurementId: "G-P2ZDW69QXQ"
};
firebase.initializeApp(firebaseConfig);
var database = firebase.database();

function loginPatient() {
    var email = document.getElementById("email").value;
    var password = document.getElementById("password").value;
    if(email=="" || password=="") {document.getElementById("error").innerText="Fill all fields"; return;}

    database.ref("patients").once("value", function(snapshot) {
        var users = snapshot.val();
        var found = false;

        for(var key in users) {
            if(users[key].email === email) {
                found = true;
                if(users[key].password === password) {
                    localStorage.setItem("currentPatient", key);
                    window.location.href = "dashboard.html"; // redirect to patient dashboard
                } else {
                    document.getElementById("error").innerText = "Wrong password";
                }
                break;
            }
        }

        // If email not found, create new patient automatically
        if(!found){
            var newPatient = {
                email: email,
                password: password,
                name: "Patient " + Date.now()
            };
            var newKey = database.ref("patients").push(newPatient).key;
            localStorage.setItem("currentPatient", newKey);
            window.location.href = "dashboard.html";
        }
    });
}
</script>

</body>
</html>
