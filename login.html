<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Smart Health</title>
<style>
body { font-family: Arial; display:flex; justify-content:center; align-items:center; height:100vh; background:#2196F3; }
.container { background:#fff; padding:30px; border-radius:8px; width:300px; text-align:center; }
input { width:90%; padding:10px; margin:10px 0; }
button { padding:10px 20px; background:#ff4b5c; color:#fff; border:none; cursor:pointer; }
a { display:block; margin-top:10px; color:#2196F3; }
</style>
</head>
<body>
<div class="container">
<h2>Login</h2>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button id="loginBtn">Login</button>
<a href="#" id="forgotPassword">Forgot Password?</a>
<p id="message"></p>
</div>

<script>
const loginBtn = document.getElementById('loginBtn');
const forgotPasswordLink = document.getElementById('forgotPassword');

loginBtn.addEventListener('click', () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    firebase.auth().signInWithEmailAndPassword(email, password)
    .then((userCredential) => {
        const uid = userCredential.user.uid;
        // Get user role from database
        firebase.database().ref('users/' + uid).once('value').then((snapshot) => {
            const role = snapshot.val().role;
            if(role === "doctor"){
                window.location = "doctor-dashboard.html";
            } else {
                window.location = "patient-dashboard.html";
            }
        });
    })
    .catch((error) => {
        document.getElementById('message').innerText = error.message;
    });
});

forgotPasswordLink.addEventListener('click', () => {
    const email = prompt("Enter your email for password reset:");
    if(email){
        firebase.auth().sendPasswordResetEmail(email)
        .then(() => alert("Password reset email sent!"))
        .catch((error) => alert(error.message));
    }
});

// Auto redirect if already logged in
firebase.auth().onAuthStateChanged((user) => {
    if(user){
        const uid = user.uid;
        firebase.database().ref('users/' + uid).once('value').then((snapshot) => {
            const role = snapshot.val().role;
            if(role === "doctor"){
                window.location = "doctor-dashboard.html";
            } else {
                window.location = "patient-dashboard.html";
            }
        });
    }
});
</script>
</body>
</html>
