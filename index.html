<!DOCTYPE html>
<html>
<head>
  <title>Patient Monitor</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      transition: background 0.5s;
    }
    h1 { margin-top: 20px; }
    canvas { max-width: 90%; }
  </style>
</head>

<body>
<h1>Live Patient SpO₂ Monitor</h1>
<h2 id="spo2">-- %</h2>
<canvas id="chart"></canvas>

<script>
  // Firebase config
  var firebaseConfig = {
    apiKey: "AIzaSyCq4-w3QU9AWdu97W3moKyih6ANCN0mFxE",
    databaseURL: "https://health-monitor-58970-default-rtdb.firebaseio.com/",
    projectId: "health-monitor-58970"
  };
  firebase.initializeApp(firebaseConfig);

  var ctx = document.getElementById('chart').getContext('2d');
  var dataPoints = [];

  var chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: 'SpO₂ %',
        data: dataPoints,
        borderColor: 'blue',
        fill: false
      }]
    }
  });

  firebase.database().ref("patient/spo2").on("value", snap => {
    var value = snap.val();
    document.getElementById("spo2").innerText = value + " %";

    dataPoints.push(value);
    if (dataPoints.length > 20) dataPoints.shift();
    chart.update();

    document.body.style.background =
      value < 94 ? "#ffcccc" :
      value < 97 ? "#fff3cd" :
      "#d4edda";
  });
</script>
</body>
</html>
