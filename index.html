<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Remote Health Monitoring</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#141e30,#243b55);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}
.container{
  width:360px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(12px);
  border-radius:16px;
  padding:25px;
  box-shadow:0 15px 40px rgba(0,0,0,0.4);
}
h2{text-align:center}
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:8px;
}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#00e5ff;
  font-weight:600;
  cursor:pointer;
}
button:hover{background:#00bcd4}
.card{
  background:rgba(0,0,0,0.3);
  border-radius:12px;
  padding:15px;
  margin:12px 0;
  text-align:center;
}
.value{font-size:26px;font-weight:600}
.normal{color:#00ff99}
.alert{color:#ff5252}
.logout{background:#ff5252;color:white}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN PAGE -->
<div id="loginPage">
  <h2>Patient Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">
  <h2>Live Health Data</h2>

  <div class="card">
    Temperature
    <div class="value"><span id="temp">--</span> °C</div>
  </div>

  <div class="card">
    Status
    <div class="value" id="status">--</div>
  </div>

  <button class="logout" onclick="logout()">Logout</button>
</div>

</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
/* FIREBASE CONFIG */
var firebaseConfig = {
  apiKey: "AIzaSyCq4-w3QU9AWdu97W3moKyih6ANCN0mFxE",
  authDomain: "health-monitor-58970.firebaseapp.com",
  databaseURL: "https://health-monitor-58970-default-rtdb.firebaseio.com",
  projectId: "health-monitor-58970",
  storageBucket: "health-monitor-58970.appspot.com",
  messagingSenderId: "389520868404",
  appId: "1:389520868404:web:e2e915837835454825f661"
};
firebase.initializeApp(firebaseConfig);

/* LOGIN */
function login(){
  var email=document.getElementById("email").value;
  var password=document.getElementById("password").value;

  firebase.auth().signInWithEmailAndPassword(email,password)
  .then(()=>{
    document.getElementById("loginPage").style.display="none";
    document.getElementById("dashboard").style.display="block";
    startLiveData();
  })
  .catch(err=>alert(err.message));
}

/* LIVE DATA */
function startLiveData(){
  firebase.database().ref("patient").on("value", snap=>{
    if(snap.exists()){
      let d=snap.val();
      document.getElementById("temp").innerText=d.temperature;

      if(d.status==1){
        document.getElementById("status").innerText="NORMAL";
        document.getElementById("status").className="value normal";
      }else{
        document.getElementById("status").innerText="ALERT";
        document.getElementById("status").className="value alert";
      }
    }
  });
}

/* LOGOUT */
function logout(){
  firebase.auth().signOut();
  document.getElementById("dashboard").style.display="none";
  document.getElementById("loginPage").style.display="block";
}
</script>

</body>
</html>
