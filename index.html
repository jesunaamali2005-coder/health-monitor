<!DOCTYPE html>
<html>
<head>
  <title>Patient Monitor</title>

  <script>
  var firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    databaseURL: "https://health-monitor-58970-default-rtdb.firebaseio.com/",
    projectId: "health-monitor-58970"
  };
  firebase.initializeApp(firebaseConfig);

  const spo2Text = document.getElementById("spo2");

  const ctx = document.getElementById("chart").getContext("2d");

  let labels = [];
  let values = [];

  const chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: labels,
      datasets: [{
        label: "SpO₂ %",
        data: values,
        borderWidth: 2,
        tension: 0.4
      }]
    },
    options: {
      animation: false,
      scales: {
        y: {
          min: 90,
          max: 100
        }
      }
    }
  });

  firebase.database().ref("patient").on("value", snapshot => {
    const data = snapshot.val();
    if (!data) return;

    const spo2 = data.spo2;

    // Update text
    spo2Text.innerText = spo2 + " %";

    // Background color logic
    document.body.style.background =
      spo2 < 94 ? "#ffb3b3" :
      spo2 < 97 ? "#fff0b3" :
      "#ccffcc";

    // Push graph data
    const timeLabel = new Date().toLocaleTimeString();

    labels.push(timeLabel);
    values.push(spo2);

    // Keep graph moving (limit points)
    if (labels.length > 20) {
      labels.shift();
      values.shift();
    }

    chart.update();
  });
</script>


  <style>
    body {
      font-family: Arial;
      text-align: center;
      transition: background 0.5s;
    }
    h1 { margin-top: 20px; }
    canvas { max-width: 90%; }
  </style>
</head>

<body>
<h1>Live Patient SpO₂ Monitor</h1>
<h2 id="spo2">-- %</h2>
<canvas id="chart"></canvas>

<script>
  // Firebase config
  var firebaseConfig = {
    apiKey: "AIzaSyCq4-w3QU9AWdu97W3moKyih6ANCN0mFxE",
    databaseURL: "https://health-monitor-58970-default-rtdb.firebaseio.com/",
    projectId: "health-monitor-58970"
  };
  firebase.initializeApp(firebaseConfig);

  var ctx = document.getElementById('chart').getContext('2d');
  var dataPoints = [];

  var chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: 'SpO₂ %',
        data: dataPoints,
        borderColor: 'blue',
        fill: false
      }]
    }
  });

  firebase.database().ref("patient/spo2").on("value", snap => {
    var value = snap.val();
    document.getElementById("spo2").innerText = value + " %";

    dataPoints.push(value);
    if (dataPoints.length > 20) dataPoints.shift();
    chart.update();

    document.body.style.background =
      value < 94 ? "#ffcccc" :
      value < 97 ? "#fff3cd" :
      "#d4edda";
  });
</script>
</body>
</html>
