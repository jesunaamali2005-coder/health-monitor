<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Patient SpO2 Monitor</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #1d2671, #c33764);
  color: white;
  text-align: center;
  margin: 0;
  padding: 0;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

.card {
  background: rgba(255,255,255,0.1);
  border-radius: 15px;
  padding: 20px;
  margin-top: 20px;
}

h1 {
  margin-top: 20px;
}

.value {
  font-size: 48px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
  <h1>Live Patient SpO₂ Monitor</h1>

  <div class="card">
    <h2>SpO₂ Level</h2>
    <div class="value" id="spo2">-- %</div>
  </div>

  <div class="card">
    <canvas id="spo2Chart"></canvas>
  </div>
</div>

<script>
/* 🔥 FIREBASE CONFIG */
var firebaseConfig = {
  apiKey: "AIzaSyCq4-w3QU9AWdu97W3moKyih6ANCN0mFxE",
  authDomain: "health-monitor-58970.firebaseapp.com",
  databaseURL: "https://health-monitor-58970-default-rtdb.firebaseio.com",
  projectId: "health-monitor-58970",
  storageBucket: "health-monitor-58970.firebasestorage.app",
  messagingSenderId: "389520868404",
  appId: "1:389520868404:web:e2e915837835454825f661",
  measurementId: "G-P2ZDW69QXQ"
};

firebase.initializeApp(firebaseConfig);
var database = firebase.database();

/* 📊 CHART SETUP */
const ctx = document.getElementById('spo2Chart').getContext('2d');
const spo2Chart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: [],
    datasets: [{
      label: 'SpO₂ %',
      data: [],
      borderColor: '#00ffcc',
      fill: false,
      tension: 0.3
    }]
  },
  options: {
    responsive: true,
    scales: {
      y: {
        min: 80,
        max: 100
      }
    }
  }
});

/* 🔄 LIVE DATA FETCH */
database.ref('/patient/spo2').on('value', (snapshot) => {
  const spo2 = snapshot.val();
  if (spo2 !== null) {
    document.getElementById("spo2").innerText = spo2 + " %";

    const time = new Date().toLocaleTimeString();
    spo2Chart.data.labels.push(time);
    spo2Chart.data.datasets[0].data.push(spo2);

    if (spo2Chart.data.labels.length > 10) {
      spo2Chart.data.labels.shift();
      spo2Chart.data.datasets[0].data.shift();
    }

    spo2Chart.update();
  }
});
</script>

</body>
</html>
