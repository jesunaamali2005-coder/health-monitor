<!DOCTYPE html>
<html>
<head>
  <title>Patient Monitor</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
  <h1>Patient Live Data</h1>
  <h2 id="temp"></h2>
  <h2 id="status"></h2>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyCq4-w3QU9AWdu97W3moKyih6ANCN0mFxE",
    databaseURL: "https://health-monitor-58970-default-rtdb.firebaseio.com"
  };
  firebase.initializeApp(firebaseConfig);

  firebase.database().ref("patient").on("value", snap => {
    document.getElementById("temp").innerText =
      "Temperature: " + snap.val().temperature + " °C";
    document.getElementById("status").innerText =
      "Status: " + snap.val().status;
  });
</script>
</body>
</html>
