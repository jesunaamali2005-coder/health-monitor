<!DOCTYPE html>
<html>
<head>
  <title>Patient Monitor</title>
  <style>
    body {
      font-family: Arial;
      background: linear-gradient(to right, #141e30, #243b55);
      color: white;
      text-align: center;
      padding-top: 50px;
    }
    .card {
      background: #1f2a44;
      width: 300px;
      margin: auto;
      padding: 20px;
      border-radius: 10px;
    }
    h2 { color: #00e6e6; }
  </style>
</head>
<body>

<div class="card">
  <h2>Live Patient Data</h2>
  <p>SpO₂: <span id="spo2">--</span> %</p>
  <p>Status: <span id="status">--</span></p>
</div>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyCq4-w3QU9AWdu97W3moKyih6ANCN0mFxE",
    databaseURL: "https://health-monitor-58970-default-rtdb.firebaseio.com/"
  };
  firebase.initializeApp(firebaseConfig);

  firebase.database().ref("patient").on("value", function(snapshot) {
    document.getElementById("spo2").innerText = snapshot.val().spo2;
    document.getElementById("status").innerText = snapshot.val().status;
  });
</script>

</body>
</html>
